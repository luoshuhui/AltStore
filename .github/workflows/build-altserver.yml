name: Build AltServer (with PR 1875)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: classic
          submodules: recursive

      - name: Apply PR #1875
        run: |
          curl -sSL https://github.com/altstoreio/AltStore/pull/1875.patch | git apply

      - name: Fix AltSign linker settings
        run: |
          python3 - << 'EOF'
          import glob, os, re
          p = "Dependencies/AltSign/Package.swift"
          fw_dir = glob.glob(os.path.abspath("Dependencies/AltSign/Dependencies/OpenSSL/Frameworks/OpenSSL.xcframework/macos-*"))[0]
          lib_dir = os.path.abspath("build/Build/Products/Release")
          with open(p) as f:
              s = f.read()
          s, n1 = re.subn(
              r'(name:\s*"ldid",[\s\S]*?cxxSettings:\s*\[\s*\.unsafeFlags\(\["-w"\]\)\s*\])',
              lambda m: m.group(1) + f', linkerSettings: [.unsafeFlags(["-F", "{fw_dir}"]), .linkedFramework("OpenSSL")]',
              s,
              count=1
          )
          s, n2 = re.subn(
              r'(name:\s*"AltSign",[\s\S]*?\.define\("CORECRYPTO_DONOT_USE_TRANSPARENT_UNION=1"\),\s*\])',
              lambda m: m.group(1) + f', linkerSettings: [.unsafeFlags(["-L", "{lib_dir}"]), .linkedLibrary("corecrypto_static")]',
              s,
              count=1
          )
          assert n1 == 1 and n2 == 1, f"patch failed: n1={n1}, n2={n2}"
          with open(p, "w") as f:
              f.write(s)
          EOF

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Build corecrypto_static
        run: |
          xcodebuild -project Dependencies/AltSign/Dependencies/corecrypto/corecrypto.xcodeproj \
            -target corecrypto_static \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build/Build/Products/Release" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build AltServer
        run: |
          xcodebuild -workspace AltStore.xcworkspace \
            -scheme AltServer \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip AltServer.app
        run: |
          cd build/Build/Products/Release
          zip -r AltServer-PR1875.zip AltServer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltServer-PR1875
          path: build/Build/Products/Release/AltServer-PR1875.zip
