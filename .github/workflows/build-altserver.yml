name: Build AltServer (with PR 1875)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Select compatible Xcode version
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: classic
          submodules: recursive

      - name: Apply PR #1875
        run: |
          curl -sSL https://github.com/altstoreio/AltStore/pull/1875.patch | git apply

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Build AltServer
        run: |
          xcodebuild -workspace AltStore.xcworkspace \
            -scheme AltServer \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip AltServer.app
        run: |
          cd build/Build/Products/Release
          zip -r AltServer-PR1875.zip AltServer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltServer-PR1875
          path: build/Build/Products/Release/AltServer-PR1875.zip
