name: Build AltServer (with PR 1875)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          ref: classic
          submodules: recursive

      - name: Apply PR #1875
        run: |
          curl -sSL https://github.com/altstoreio/AltStore/pull/1875.patch | git apply

      - name: Fix AltSign ldid OpenSSL linker flags
        run: |
          python3 -c '
          import glob, os
          p = "Dependencies/AltSign/Package.swift"
          fw_dir = glob.glob(os.path.abspath("Dependencies/AltSign/Dependencies/OpenSSL/Frameworks/OpenSSL.xcframework/macos-*"))[0]
          with open(p) as f:
              s = f.read()
          old = """            cxxSettings: [
                          .unsafeFlags(["-w"])
                      ]
                  ),"""
          old = old.replace("\n          ", "\n")
          new = f"""            cxxSettings: [
                          .unsafeFlags(["-w"])
                      ],
                      linkerSettings: [
                          .unsafeFlags(["-F", "{fw_dir}"]),
                          .linkedFramework("OpenSSL")
                      ]
                  ),""".replace("\n          ", "\n")
          assert old in s, "target block not found"
          with open(p, "w") as f:
              f.write(s.replace(old, new, 1))
          '

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Build AltServer
        run: |
          xcodebuild -workspace AltStore.xcworkspace \
            -scheme AltServer \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip AltServer.app
        run: |
          cd build/Build/Products/Release
          zip -r AltServer-PR1875.zip AltServer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltServer-PR1875
          path: build/Build/Products/Release/AltServer-PR1875.zip
